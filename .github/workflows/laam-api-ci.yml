name: laam-api CI

on:
  push:
    paths:
      - "laam-api/**"
      - ".github/workflows/laam-api-ci.yml"
  pull_request:
    paths:
      - "laam-api/**"
      - ".github/workflows/laam-api-ci.yml"

concurrency:
  group: laam-api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tdd:
    name: 백엔드 TDD 검증 (관리자·사용자 API)
    runs-on: ubuntu-latest

    # store 패키지의 통합 테스트(internal/store/docker_test.go TestMain)가
    # `docker run`으로 postgres:16-alpine 컨테이너를 직접 기동·정리하므로
    # 별도의 services 컨테이너는 두지 않는다. ubuntu-latest 러너는 Docker를
    # 기본 제공한다.
    defaults:
      run:
        working-directory: laam-api
        shell: bash

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Go 설치
        uses: actions/setup-go@v5
        with:
          go-version-file: laam-api/go.mod
          cache-dependency-path: laam-api/go.sum

      - name: 코드 포맷 검사 (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            {
              echo "## ❌ gofmt 검사 실패"
              echo ""
              echo "아래 파일이 \`gofmt\` 규칙을 따르지 않습니다. \`gofmt -w .\`로 정리해 주세요."
              echo '```'
              echo "$UNFORMATTED"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 정적 분석 (go vet)
        run: go vet ./...

      - name: 빌드
        run: go build ./...

      - name: 백엔드 TDD 테스트 실행 (관리자·사용자 API 전체)
        run: |
          set -o pipefail
          go test ./... -v -count=1 2>&1 | tee test-output.log

      - name: 테스트 결과 요약
        if: always()
        run: |
          {
            echo "## 🧪 laam-api 백엔드 TDD 결과"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f test-output.log ]; then
            echo "테스트 로그가 생성되지 않았습니다. 이전 단계 실패 여부를 확인해 주세요." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          PASS_COUNT=$(grep -c '^--- PASS' test-output.log || true)
          FAIL_COUNT=$(grep -c '^--- FAIL' test-output.log || true)
          NO_TEST=$(grep -c '^\?.*\[no test files\]' test-output.log || true)

          {
            echo "| 구분 | 개수 |"
            echo "| --- | --- |"
            echo "| 통과 | ${PASS_COUNT} |"
            echo "| 실패 | ${FAIL_COUNT} |"
            echo "| 테스트 없는 패키지 | ${NO_TEST} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAIL_COUNT" -gt 0 ]; then
            {
              echo "### 실패한 테스트"
              echo '```'
              grep '^--- FAIL' test-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "실패한 테스트가 없습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 테스트 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laam-api-test-log
          path: laam-api/test-output.log
          retention-days: 7
